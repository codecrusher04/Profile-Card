<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW Portfolio Card</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .card{
            padding: 40px;
            margin: 40px;
            display: flexbox;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            background-color: rgba(105, 108, 145, 0.676);
            height: 380px;
            width: 250px;
            transition-duration: 1s;
            transition-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1);
            transition-property: all;
        }
        .card:hover{
            box-shadow: 3px 3px  10px 2px rgba(0, 0, 0, 0.326);
            transition-duration: 1s;
            transition-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1);
            transition-property: all;
        }
        img{
            padding: 2px;
            border-radius: 70px;
            align-items: center;
            justify-content: center;
            margin-left: 70px;
            margin-right: 50px;
            margin-top: 5px;
            height: 100px;
            width: 100px;
        }
        div{
            color: rgb(39, 40, 39);
            font-size: 15px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        .name{
            display: flexbox;
            justify-content: left;
            align-items: center;
            padding: 10px;
            margin-top: 5px;
            margin-left: center;
            margin-right: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-weight: 900;
            font-size: 25px;
            color: rgb(73, 56, 186);
            transition: transform 0.2s ease, color 0.2s ease;    
            transition-duration: 1s;
            transition-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1);
            transition-property: all;
        }
        .name:hover{
            color: rgba(43, 38, 94, 0.92);  
            transform: scale(0.8);
            cursor: pointer;
            transition-duration: 1s;
            transition-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1);
            transition-property: all;
        }
        section{
            display: inline-block;
            margin-top: 2px;
            padding: 10px;
            border-radius: 15px;
            color: rgb(36, 65, 129);
            background-color: rgba(120, 132, 150, 0.578);
        }
        b{
            color: rgb(49, 49, 49);
            display: inline-block;
            transition: transform 0.2s ease, color 0.2s ease;
        }
        b:hover{
            color: azure;
            transform: scale(0.9);
            cursor: pointer;
        }
       p{
        display: flex;
        align-items:center;
        justify-content: left;
        width: 200px;
        gap: 10px;
        margin-left: 5px;
        margin-right: 10px;
        padding-right: 40px;
        padding-left: auto;
        margin-top: 20px;
        color: rgb(235, 232, 232);
        background-color: rgb(75, 75, 75);
        border-radius: 20px;
        transition-duration: 1s;
        transition-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1);
        transition-property: all;
           }
       
        p:hover{
        color: rgba(87, 42, 170, 0.877);
        background-color: white;
        cursor: pointer;
        transition-duration: 1s;
        transition-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1);
        transition-property: all;
           }
       .mailbox{
        display: flex;
        align-items: center;
       }
       .mailbox img{
        display: inline-block;
        height: 20px;
        width: auto;
        margin-right: 0px;
        color: white;
       }
    footer{
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 15px;
        margin-right: 150px;
        margin-top: 25px;
        height: 50px;
        width: 100%;
        background-color: rgba(199, 197, 197, 0.427);
        transition-duration: 2s;
        transition-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1);
        transition-property: all;
    }
    footer:hover{
        background-color: rgba(127, 113, 147, 0.63);
        cursor: pointer;
        transition-duration: 2s;
        transition-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1);
        transition-property: all;
    }
      .socialnetwork{
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .socialnetwork svg{
       width: 20px;
       height: 20px;
}
.socialnetwork svg:hover{
    cursor: pointer;
}
#insta:hover{
    /* fill:rgba(121, 44, 125, 0.79) ; */
    fill:white;
}
#fb:hover{
fill: blue;
}
#yt:hover{
    fill: red;
}
    </style>

</head>

    <div class="card">

             <img src="./Profile%20Photo.png" alt="ProfilePic">

    <section>Creative Developer skilled in <b>HTML</b>,<b> CSS</b>, and <b>JavaScript</b>, 
        passionate about web development, AI, and building impactful digital experiences.</section>

        <footer>

        </div>
        </footer>
    </div>
</body>
